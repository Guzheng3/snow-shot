# Snow Shot - Windows-only 构建工作流 (原生翻译+OCR，无插件依赖)
name: Snow Shot Windows CI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: high
            product_name: "Snow Shot"
            artifact_name: snow-shot-windows-x64
            # 高精度版：关闭 updater 增量包（避免签名私钥要求）
            tauri_config: '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"pubkey":""}}}'
          - variant: quant
            # 量化版：内置 PP-OCRv5 mobile 模型（体积更小），以产品名区分安装包
            product_name: "Snow Shot Quant"
            artifact_name: snow-shot-quant-windows-x64
            tauri_config: '{"productName":"Snow Shot Quant","bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"pubkey":""}}}'
    steps:
      # 拉代码。lfs:true 保险：若 lib/ 是 LFS 文件则拉真实内容（非 LFS 则无副作用）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Node + pnpm
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.8.1

      # Rust（windows-latest 自带 MSVC host target，无需额外 rustup target add）
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Rust 缓存：第二次起只重编改动部分
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # pnpm 缓存
      - name: Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # yarn（excalidraw 构建用）
      - name: Install yarn
        run: npm install -g yarn

      # 克隆 excalidraw（作者 fork 的 custom/master 分支，构建本地包用）
      - name: Clone Excalidraw
        run: |
          cd ..
          git clone --depth 1 --branch custom/master https://github.com/Guzheng3/excalidraw.git
        shell: bash

      # yarn 缓存
      - name: Cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.yarn/cache
            ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      # 安装 excalidraw 依赖
      - name: Install Excalidraw dependencies
        run: |
          cd ../excalidraw
          for i in 1 2 3 4 5; do
            yarn install --frozen-lockfile --network-timeout 600000 && break
            echo "yarn install failed (attempt $i), retrying in 10s..."
            sleep 10
          done
        shell: bash

      # 创建 .env（联网功能开）。量化版额外设置默认识别模型为 mobile
      - name: Create .env file
        run: |
          echo "PUBLIC_ONLINE_STATUS=true" > .env
          if [ "${{ matrix.variant }}" = "quant" ]; then
            echo "PUBLIC_OCR_MODEL_DEFAULT=RapidOcrV5Mobile" >> .env
          fi
        shell: bash



      # 构建 excalidraw 本地包（先构建出 dist，再装主项目依赖，确保 pnpm 链接到含字体的完整包）
      - name: Build Excalidraw
        run: |
          cd ../excalidraw
          rm -rf ./packages/excalidraw/dist
          yarn build:packages
        shell: bash

      # 安装主项目前端依赖（此时 excalidraw 已有完整 dist）
      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      # 下载 onnxruntime 静态库（Windows x64，覆盖仓库内可能为 LFS 指针的 lib/）
      - name: Download and setup onnxruntime (Windows)
        run: |
          Invoke-WebRequest -Uri "https://github.com/supertone-inc/onnxruntime-build/releases/download/v1.22.2/onnxruntime-win-x64-static_lib-1.22.2.zip" -OutFile "onnxruntime.zip"
          Expand-Archive -Path "onnxruntime.zip" -DestinationPath "onnxruntime-temp" -Force
          $libPath = Get-ChildItem -Path "onnxruntime-temp" -Recurse -Directory -Filter "lib" | Select-Object -First 1
          if ($libPath) {
            Copy-Item -Path $libPath.FullName -Destination "src-tauri\lib" -Recurse -Force
            Write-Host "Successfully copied lib folder to src-tauri"
          } else {
            Write-Error "lib folder not found in extracted files"
            exit 1
          }
          Remove-Item -Path "onnxruntime.zip" -Force
          Remove-Item -Path "onnxruntime-temp" -Recurse -Force
        shell: pwsh

      # 量化版需要覆盖 OCR 模型：构建产物根目录只允许一套模型（bundle.resources 的 rapid_ocr/ 目标同名冲突），
      # 因此先清空 rapid_ocr/ 再复制 mobile 模型进去，从而打进自己的安装包。
      # 注意：mobile 版复用 server 版共享的 cls 分类模型 ch_ppocr_mobile_v2.0_cls_mobile.onnx，
      # 该文件在 mobile 目录中并不存在，须在清空目录前备份、覆盖后恢复，否则 OCR 会话因缺 cls 模型而初始化失败。
      - name: Override OCR models for quant build (bare-exe compatibility)
        if: matrix.variant == 'quant'
        run: |
          $quickOcrDir = "src-tauri\resources\rapid_ocr"
          $mobileDir = "src-tauri\resources\rapid_ocr_mobile"
          $clsName = "ch_ppocr_mobile_v2.0_cls_mobile.onnx"
          $clsSource = Join-Path $quickOcrDir $clsName
          $clsBackup = Join-Path $env:TEMP $clsName
          # 备份共享的 cls 模型（若存在）
          if (Test-Path $clsSource) {
            Copy-Item -Path $clsSource -Destination $clsBackup -Force
            Write-Host "Backed up shared cls model to temp"
          }
          # 清空 rapid_ocr/（整目录，确保只打进 mobile 一套模型）
          if (Test-Path $quickOcrDir) {
            Remove-Item -Path "$quickOcrDir\*" -Recurse -Force -ErrorAction SilentlyContinue
          } else {
            New-Item -ItemType Directory -Force -Path $quickOcrDir | Out-Null
          }
          if (Test-Path $mobileDir) {
            Copy-Item -Path "$mobileDir\*" -Destination $quickOcrDir -Recurse -Force
            # 恢复共享的 cls 模型
            if (Test-Path $clsBackup) {
              Copy-Item -Path $clsBackup -Destination (Join-Path $quickOcrDir $clsName) -Force
              Remove-Item -Path $clsBackup -Force
            }
            Write-Host "Copied mobile OCR models into rapid_ocr for quant build"
          } else {
            Write-Error "rapid_ocr_mobile directory not found"
            exit 1
          }
        shell: pwsh

      # 构建 Tauri 应用（beforeBuildCommand=pnpm build 会自动先构建前端）
      # TAURI_CONFIG 关闭 updater 增量包 → 不需要签名私钥；量化版在此同时覆盖 productName
      - name: Build the app (Windows x64)
        env:
          CI: false
          TAURI_CONFIG: ${{ matrix.tauri_config }}
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      # 裸 exe 兼容：resourceDir() 解析到 exe 同级目录，把 app-icons 复制一份到 exe 同级
      # （resources/app-icons 是 Tauri 标准位置，exe 同级 app-icons 是裸 exe 运行时查找的位置）
      - name: Copy app-icons next to exe (bare-exe compatibility)
        run: |
          $releaseDir = "src-tauri\target\x86_64-pc-windows-msvc\release"
          if (Test-Path "src-tauri\app-icons") {
            Copy-Item -Path "src-tauri\app-icons" -Destination "$releaseDir\app-icons" -Recurse -Force
            Write-Host "Copied app-icons next to exe: $releaseDir\app-icons"
          } else {
            Write-Host "src-tauri/app-icons not found, skip"
          }
        shell: pwsh

      # 裸 exe 兼容：把 OCR 模型（rapid_ocr）与内置字体（fonts）也复制到 exe 同级。
      # resourceDir() 对裸 exe 解析到 exe 所在目录，模型/字体缺失将导致 OCR 无法识别、字体安装失败。
      - name: Copy rapid_ocr & fonts next to exe (bare-exe compatibility)
        run: |
          $releaseDir = "src-tauri\target\x86_64-pc-windows-msvc\release"
          if (Test-Path "src-tauri\resources\rapid_ocr") {
            Copy-Item -Path "src-tauri\resources\rapid_ocr" -Destination "$releaseDir\rapid_ocr" -Recurse -Force
            Write-Host "Copied rapid_ocr next to exe"
          } else {
            Write-Host "src-tauri/resources/rapid_ocr not found, skip"
          }
          if (Test-Path "src-tauri\resources\fonts") {
            Copy-Item -Path "src-tauri\resources\fonts" -Destination "$releaseDir\fonts" -Recurse -Force
            Write-Host "Copied fonts next to exe"
          } else {
            Write-Host "src-tauri/resources/fonts not found, skip"
          }
        shell: pwsh

      # 上传产物（NSIS 安装包 + 主程序 + resources + 随包模型/字体），Actions 页面可直接下载
      # resources/ 含 app-icons 托盘图标 png，裸 exe 依赖它显示设置页预览图，必须一起传；
      # rapid_ocr/ 与 fonts/ 已复制到 exe 同级（裸 exe 兼容），也必须上传，否则 OCR 无法识别。
      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/**/release/bundle/
            src-tauri/target/**/release/snowshot.exe
            src-tauri/target/**/release/resources/
            src-tauri/target/**/release/app-icons/
            src-tauri/target/**/release/rapid_ocr/
            src-tauri/target/**/release/fonts/
          if-no-files-found: warn
          retention-days: 14
