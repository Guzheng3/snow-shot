[package]
name = "snow-shot-tauri-commands-ocr"
version = "0.1.0"
edition = "2024"

[dependencies]
tauri = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
image = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
# 禁用默认特性（默认含 lzma/bzip2/zstd 等压缩后端），仅启用 deflate，
# 避免 liblzma-sys 与 ffmpeg-sidecar->xz2->lzma-sys 的 links="lzma" 冲突
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

snow-shot-app-services = { workspace = true }

paddle-ocr-rs = { workspace = true }

[target.'cfg(any(target_os = "windows"))'.dependencies]
snow-shot-webview = { workspace = true }
